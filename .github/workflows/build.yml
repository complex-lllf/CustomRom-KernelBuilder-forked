name: Compile Kernel

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand: Select your brand"
        required: true
        type: choice
        default: oneplus
        options:
          - Manual-Type
          - oneplus
          - xiaomi
          - sony

      brand_manual:
        description: "Brand-Manual: If selected Manual-Type in previous options, manually type ur brand"
        required: false
        type: string
        default: ""

      soc:
        description: "SOC: Type your soc"
        required: true
        type: string
        default: "sdm845"

      clang_version:
        description: "Clang-Version: Select the clang version of ur kernel"
        required: true
        type: choice
        default: clang-r487747c
        options:
          - clang-r416183b1
          - clang-r450784d
          - clang-r487747c
          - clang-r536225
          - clang-r547379
          - clang-r563880c

      kernel_source:
        description: "Kernel-Source: Kernel repo's org/user on github"
        required: true
        type: choice
        default: LineageOS
        options:
          - Manual-Type
          - LineageOS
          - YAAP
          - PixelOS-Devices
          - PixelExperience-Devices
          - VoltageOS-Devices
          - BlissRoms-Devices
          - AxionAOSP-devices
          - AlphaDroid-devices
          - DerpFest-Devices
          - MistOS-Devices
          - crdroidandroid
          - Evolution-X-Devices
          - Infinity-X-Devices
          - OnePlus12R-development
          - complex-lllf
          - ppanzenboeck

      kernel_source_manual:
        description: "Kernel-Source-Manual: If u selected Manual-Type, manually type ur repo's org/user on github here."
        required: false
        type: string
        default: ""

      kernel_source_format:
        description: "Source-Format: Select ur kernel source format"
        required: true
        type: choice
        default: android_kernel
        options:
          - android_kernel
          - kernel

      kernel_branch:
        description: "Kernel-Branch: such as lineage-23.2 sixteen-qpr1 etc."
        required: true
        type: string
        default: "lineage-21.0"

      kernel_configs:
        description: "Kernel-Configs: Select ur kernel configs"
        required: true
        type: choice
        default: oplus-sdm845-los
        options:
          - Manual-Type
          - oplus-sdm845-los
          - oplus-sm8150-los
          - oplus-sm8150-yaap
          - oplus-sm8250-los
          - oplus-sm8350-los
          - oplus-sm8550-los
          - oplus-sm8650-los
          - oplus-sm8750-los

      kernel_configs_manual:
        description: "Kernel-Configs-Manual: If Manual-Type selected, type ur configs here"
        required: false
        type: string
        default: ""

      ksu_type:
        description: "KSU: KernelSU Version"
        required: true
        type: choice
        default: None
        options:
          - None
          - Official-KernelSU
          - KernelSU-Next
          - KernelSU-Next-with-susfs
          - KowSU
          - KernelSU-by-xx
          - ReSukiSU
          - ReSukiSU-with-susfs

      susfs-gki:
        description: "SUSFS-GKI: select ur kernel version(for gki)"
        required: true
        type: choice
        default: None
        options:
          - None
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12

      susfs-nongki:
        description: "SUSFS-NONGKI: select ur kernel version(for nongki)"
        required: true
        type: choice
        default: None
        options:
          - None
          - "4.9"
          - "4.14"
          - "4.19"
          - "5.4"

      droidspaces:
        description: "DroidSpaces: Enable DroidSpaces"
        required: true
        type: choice
        default: None
        options:
          - None
          - "6.12"
          - 5.15-6.6
          - "5.10"
          - "5.4"
          - 4.14-4.19
          - 4.4-4.9
          - "3.18"

      modules_repo_mode:
        description: "Modules-Repo-Mode: none=skip, auto=guess, manual=use URL below"
        required: true
        type: choice
        default: none
        options:
          - none
          - auto
          - manual

      modules_repo_manual:
        description: "Modules-Repo-Manual: Full https clone URL when mode=manual"
        required: false
        type: string
        default: ""

      enable_tmpfs-xattr:
        description: "TMPFS_XATTR: enable if kernel has no CONFIG_TMPFS_XATTR=y"
        required: true
        type: boolean
        default: false

      enable_gcc:
        description: "Enable-GCC: Enable GCC support(mostly for 4.14 and below)"
        required: true
        type: boolean
        default: false

      enable_gcc_32bits:
        description: "Enable-GCC-32Bits: Enable 32Bits GCC(mostly for 4.9 and below)"
        required: true
        type: boolean
        default: false

      fuck_modules_sig_protect:
        description: "Fuck-Modules-Sig-Protect: bypass module sig protect"
        required: true
        type: boolean
        default: false

      fuck_werror:
        description: "Fuck-Werror: disable WERROR and CC_WERROR"
        required: true
        type: boolean
        default: false

      enable_my_own_susfs_patch:
        description: "apply patches in patches dir about susfs"
        required: true
        type: boolean
        default: false

jobs:
  Kernel_CI:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio gcc-aarch64-linux-gnu

      - name: Save options
        run: |
          {
            echo "brand=${{ inputs.brand }}"
            echo "brand_manual=${{ inputs.brand_manual }}"
            echo "soc=${{ inputs.soc }}"
            echo "clang_version=${{ inputs.clang_version }}"
            echo "kernel_source=${{ inputs.kernel_source }}"
            echo "kernel_source_manual=${{ inputs.kernel_source_manual }}"
            echo "kernel_source_format=${{ inputs.kernel_source_format }}"
            echo "kernel_branch=${{ inputs.kernel_branch }}"
            echo "kernel_configs=${{ inputs.kernel_configs }}"
            echo "kernel_configs_manual=${{ inputs.kernel_configs_manual }}"
            echo "ksu_type=${{ inputs.ksu_type }}"
            echo "susfs-gki=${{ inputs['susfs-gki'] }}"
            echo "susfs-nongki=${{ inputs.susfs-nongki }}"
            echo "droidspaces=${{ inputs.droidspaces }}"
            echo "modules_repo_mode=${{ inputs.modules_repo_mode }}"
            echo "modules_repo_manual=${{ inputs.modules_repo_manual }}"
            echo "enable_tmpfs-xattr=${{ inputs['enable_tmpfs-xattr'] }}"
            echo "enable_gcc=${{ inputs.enable_gcc }}"
            echo "enable_gcc_32bits=${{ inputs.enable_gcc_32bits }}"
            echo "fuck_modules_sig_protect=${{ inputs.fuck_modules_sig_protect }}"
            echo "fuck_werror=${{ inputs.fuck_werror }}"
            echo "enable_my_own_susfs_patch=${{ inputs.enable_my_own_susfs_patch }}"
          } > options.txt

      - name: Setup Git Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Clone Kernel Source
        run: |
          if [ "${{ inputs.brand }}" = "Manual-Type" ]; then
            brand="${{ inputs.brand_manual }}"
          else
            brand="${{ inputs.brand }}"
          fi

          if [ "${{ inputs.kernel_source }}" = "Manual-Type" ]; then
            source="${{ inputs.kernel_source_manual }}"
          else
            source="${{ inputs.kernel_source }}"
          fi

          repo_url="https://github.com/${source}/${{ inputs.kernel_source_format }}_${brand}_${{ inputs.soc }}"
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${repo_url}.git" "${{ inputs.soc }}" || exit 1

          case "${{ inputs.modules_repo_mode }}" in
            none)
              echo "Skip modules repo clone"
              ;;
            auto)
              git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${repo_url}-modules.git" "${{ inputs.soc }}-modules" || exit 1
              ;;
            manual)
              git clone --depth=1 "${{ inputs.modules_repo_manual }}" "${{ inputs.soc }}-modules" || exit 1
              ;;
          esac

      - name: Download AOSP Clang
        run: |
          case "${{ inputs.clang_version }}" in
            clang-r416183b1)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-qpr3-release/clang-r416183b1.tar.gz" || exit 1
              ;;
            clang-r450784d)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-qpr3-release/clang-r450784d.tar.gz" || exit 1
              ;;
            clang-r487747c)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr3-release/clang-r487747c.tar.gz" || exit 1
              ;;
            clang-r536225)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-qpr2-release/clang-r536225.tar.gz" || exit 1
              ;;
            clang-r547379)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr3-release/clang-r547379.tar.gz" || exit 1
              ;;
            clang-r563880c)
              curl -fL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr3-release/clang-r563880c.tar.gz" || exit 1
              ;;
            *)
              echo "Unknown clang version"; exit 1
              ;;
          esac
          file clang.tar.gz | grep -q gzip || exit 1

      - name: Extract Clang and GCC
        run: |
          mkdir -p clang
          tar -xf clang.tar.gz -C clang/
          if [ "${{ inputs.enable_gcc }}" = "true" ]; then
            sudo apt install -y gcc-aarch64-linux-gnu
          fi
          if [ "${{ inputs.enable_gcc_32bits }}" = "true" ]; then
            sudo apt install -y gcc-arm-linux-gnueabi
          fi

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build Kernel
        run: |
          cd "${{ inputs.soc }}" || exit 1

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="${{ github.workspace }}/clang/bin:${PATH}"

          if [ "${{ inputs.kernel_configs }}" = "Manual-Type" ]; then
            cfg="${{ inputs.kernel_configs_manual }}"
          else
            cfg="${{ inputs.kernel_configs }}"
          fi

          make "${cfg}" || exit 1

          if [ "${{ inputs.fuck_werror }}" = "true" ]; then
            scripts/config --disable WERROR
            scripts/config --disable CC_WERROR
          fi

          make -j"$(nproc --all)" Image.gz-dtb || exit 1

      - name: Package AnyKernel3
        run: |
          mkdir -p AnyKernel3
          if [ -f "${{ inputs.soc }}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${{ inputs.soc }}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [ -f "${{ inputs.soc }}/arch/arm64/boot/Image.gz" ]; then
            cp "${{ inputs.soc }}/arch/arm64/boot/Image.gz" AnyKernel3/
            if [ -f "${{ inputs.soc }}/arch/arm64/boot/dts/qcom/${{ inputs.soc }}.dtb" ]; then
              cp "${{ inputs.soc }}/arch/arm64/boot/dts/qcom/${{ inputs.soc }}.dtb" AnyKernel3/
            fi
          else
            echo "No kernel image found"; exit 1
          fi

          kernel_name="Kernel-${{ inputs.brand }}-${{ inputs.soc }}-${{ inputs.clang_version }}"
          cd AnyKernel3
          zip -r9 "../${kernel_name}.zip" ./* || exit 1
          cd ..
          echo "ZIP_NAME=${kernel_name}.zip" >> $GITHUB_ENV

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

